<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>几何雷霆 · geo-storm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <canvas id="game" width="360" height="640"></canvas>

  <header class="hud">
    <div class="hud-group">
      <span class="label">LIFE</span>
      <div id="lives" class="lives"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="pow" class="pow">P1</span>
    </div>
    <div class="hud-group">
      <span class="label">BEST</span>
      <span id="best" class="best-value">0</span>
    </div>
    <div class="hud-group">
      <span class="label">SCORE</span>
      <span id="score" class="value">0</span>
    </div>
  </header>

  <button id="bomb" class="bomb-btn" type="button" aria-label="使用炸弹">
    <span class="bomb-label">BOMB</span>
    <span id="bomb-count" class="bomb-count">2</span>
  </button>

  <div id="overlay" class="overlay" hidden>
    <p class="over-title">GAME OVER</p>
    <p class="over-score">本局 <strong id="final-score">0</strong></p>
    <p class="over-best">最高 <strong id="final-best">0</strong></p>
    <p class="over-hint">按住并拖动重开</p>
  </div>

  <div class="rotate-hint">请竖屏游玩</div>
</main>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
